name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # AGP 9.1.1 requires Gradle 9.3.1 or newer
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build debug APK
        run: |
          set +e
          gradle :app:assembleDebug --console=plain --no-daemon 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            {
              echo '## 构建错误（摘要）'
              echo '```'
              grep -n -E "error:|FAILED|What went wrong|Could not|Execution failed|not found|cannot find" -A4 build.log | head -80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: DesktopGuard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
